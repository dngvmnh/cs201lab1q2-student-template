name: AutoGrade

on:
  push:
    branches:
      - main

permissions:
  contents: read

# If the same student pushes again while an older AutoGrade run
# is still waiting/running, cancel the older run.
concurrency:
  group: autograde-${{ github.repository }}
  cancel-in-progress: true

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
      - name: Submit commit for grading
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}

        run: |
          MAX_ATTEMPTS=60
          RETRY_DELAY=15
          SUCCESS=false

          for attempt in $(seq 1 $MAX_ATTEMPTS); do

            echo
            echo "========================================"
            echo " AutoGrade attempt $attempt/$MAX_ATTEMPTS"
            echo "========================================"

            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --output response.json \
              --write-out "%{http_code}" \
              -X POST \
              "https://autograder.workautomate.cc/api/grade" \
              -H "Content-Type: application/json" \
              -d "{
                \"assignment\": \"cs201lab1q2\",
                \"repository\": \"$REPOSITORY\",
                \"commit_sha\": \"$COMMIT_SHA\"
              }")

            echo "HTTP status: $HTTP_CODE"

            if [ -s response.json ]; then
              echo
              python -m json.tool response.json || cat response.json
            fi

            if [ "$HTTP_CODE" = "200" ]; then
              SUCCESS=true
              break
            fi

            if [ "$HTTP_CODE" = "429" ]; then
              echo
              echo "AutoGrade is currently busy."
              echo "Another submission is being graded."
              echo "Retrying in $RETRY_DELAY seconds..."

              sleep $RETRY_DELAY
              continue
            fi

            echo
            echo "AutoGrade returned an unexpected error."
            echo "HTTP status: $HTTP_CODE"
            exit 1

          done

          if [ "$SUCCESS" != "true" ]; then
            echo
            echo "AutoGrade remained busy for too long."
            echo "Please push again later."
            exit 1
          fi

          echo
          echo "========================================"
          echo " AutoGrade Result"
          echo "========================================"

          python - <<'PY'
          import json
          import sys

          with open("response.json", encoding="utf-8") as file:
              result = json.load(file)

          score = result["score"]
          max_score = result["max_score"]

          print()
          print(f"Score: {score}/{max_score}")
          print()

          for test in result.get("tests", []):
              passed = test.get("passed", False)
              status = "PASS" if passed else "FAIL"

              print(
                  f"{status}: "
                  f"{test['name']} "
                  f"({test['awarded']}/{test['points']})"
              )

          print()

          if result.get("passed"):
              print("AutoGrade: PASSED")
          else:
              print("AutoGrade: NOT YET FULL MARKS")
              sys.exit(1)
          PY